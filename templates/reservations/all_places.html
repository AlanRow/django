<div>
    {% if user.is_authenticated %}
        Hello, {{ user.username }}
    {% endif %}
    {% if places %}
    <ul>
        {% for p in places %}
        <li>{{ p.address }} ({{ p.price|floatformat:2 }})</li>
        {% endfor %}
    </ul>
    {% else%}
    <p>No places available...</p>
    {% endif %}
</div>
