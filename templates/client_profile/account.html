<div>
    {% if user.is_authenticated %}
    <p>Name: {{ user.username }}</p>
    <div>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">
                Logout
            </button>
        </form>
    </div>
    {% else %}
    <p>You are not authenticated</p>
    <div>
        <a href="{% url 'login' %}">Login</a>
    </div>
    {% endif %}
</div>
